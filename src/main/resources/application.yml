server:
  port: ${PORT:8194}
  servlet:
    context-path: /notification

spring:
  application:
    name: notification
  profiles:
    active: dev

  # Configurações de Banco de Dados e JPA (Suportado pelo core-jpa)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/glaiss?currentSchema=gl_notification&TimeZone=America/Sao_Paulo}
    username: ${USER_DB:gl_notification_app}
    password: ${PASSWORD_DB:gl_notification}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gl_notification
        jdbc:
          time_zone: America/Sao_Paulo
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: gl_notification
    user: ${USER_DB_FLYWAY:gl_notification}
    password: ${PASSWORD_DB_FLYWAY:gl_notification}

  # E-mail
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:user}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Desabilitar Discovery (Arquitetura Simplificada)
  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false

# Observabilidade e Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.glaiss: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}, spanId=%X{spanId:-}] - %msg%n"

# Chaves de Acesso para chamadas entre APIs
app:
  api-keys: ${APP_API_KEYS:teste-1234,gateway-api-key}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
